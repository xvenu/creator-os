version: "3.9"
services:
  api:
    build: .
    env_file: .env
    ports:
      - "${PORT:-8001}:8001"
    volumes:
      - ./output:/code/output
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: .
    env_file: .env
    volumes:
      - ./output:/code/output
    command: python -m app.services.worker
