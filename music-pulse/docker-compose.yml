version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: musicpulse
      POSTGRES_PASSWORD: musicpulse
      POSTGRES_DB: musicpulse
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://musicpulse:musicpulse@db:5432/musicpulse
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on: [db, redis]
  worker:
    build: .
    command: rq worker --url redis://redis:6379/0 default
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on: [redis, db]
  bot:
    build: .
    command: python -m app.bot.telegram
    env_file: .env
    depends_on: [db, redis]
volumes:
  pgdata:
